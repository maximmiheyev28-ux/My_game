name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-request.txt'
      - '.source/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'tools/**'
      - '*.py'
      - 'project.godot'
      - 'export_presets.cfg'
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore Godot project sources
        run: python3 restore_source.py
      - name: Apply branch-aware narrative dialogue
        run: python3 apply_narrative_patch.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmdline-tools;latest" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
      - name: Download Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot/editor.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -maxdepth 2 -type f -name 'Godot_v4.7.2*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
      - name: Configure Android debug signing and SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -noprompt -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Set up Python for project validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm pixel-art overhaul revision
        run: echo "Running the latest reviewed pixel-art overhaul"

      - name: Install Python for project validation and clean-slate asset staging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      # No procedural art, character, environment, lighting, animation or soundtrack
      # generators run in this workflow. Legacy art is staged out until authored
      # production assets are committed to the project.
      - name: Stage out legacy generated artwork
        run: python3 reset_visual_assets.py

      - name: Package restored project for visual overhaul
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -qr "$RUNNER_TEMP/PosledniySignal-source.zip" . \
            -x ".git/*" ".godot/*" "build/*" ".source/*"

      - name: Upload restored source inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosledniySignal-source-inspection
          path: ${{ runner.temp }}/PosledniySignal-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Validate project files
        run: python3 tools/validate_project.py
      - name: Import, parse and export ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --editor --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error|ERROR:" godot-import.log; then
            echo "::error::Godot import or script parsing emitted errors"
            exit 1
          fi
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android APK (ARM64)" build/PosledniySignal-debug.apk 2>&1 | tee godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error|ERROR:" godot-export.log; then
            echo "::error::Godot export emitted errors"
            exit 1
          fi
          test -s build/PosledniySignal-debug.apk
          unzip -t build/PosledniySignal-debug.apk
          unzip -l build/PosledniySignal-debug.apk | grep -q "lib/arm64-v8a/"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose build/PosledniySignal-debug.apk
          file build/PosledniySignal-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosledniySignal-Android-ARM64-debug
          path: build/PosledniySignal-debug.apk
          if-no-files-found: error
          retention-days: 30
