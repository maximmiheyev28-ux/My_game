name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-request.txt'
      - '.source/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'tools/**'
      - '*.py'
      - 'project.godot'
      - 'export_presets.cfg'
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore Godot project sources
        run: python3 restore_source.py
      - name: Apply branch-aware narrative dialogue
        run: python3 apply_narrative_patch.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmdline-tools;latest" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
      - name: Download Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot/editor.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -maxdepth 2 -type f -name 'Godot_v4.7.2*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
      - name: Configure Android debug signing and SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -noprompt -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Set up Python for project validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg for original soundtrack encoding
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install project validation and asset generation dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy

      - name: Generate enhanced pixel art, animations and soundtrack
        run: |
          python3 -m py_compile enhance_project.py
          python3 enhance_project.py

      - name: Install handcrafted v1.2 pixel-art, animation and OST overhaul
        run: |
          set -euo pipefail
          test -s .source/visual-v2/part-001.b64
          test -s .source/visual-v2/part-002.b64
          test -s .source/visual-v2/part-003.b64
          test -s .source/visual-v2/part-004.b64
          cat .source/visual-v2/part-*.b64 | base64 --decode | gzip -dc > visual_upgrade_v2.py
          python3 -m py_compile visual_upgrade_v2.py
          python3 visual_upgrade_v2.py

      - name: Add separate parallax foreground art layers
        run: python3 .source/visual-v2/parallax_upgrade.py

      - name: Apply v1.3 detailed character and environment art
        run: |
          set -euo pipefail
          python3 -m py_compile visual_upgrade_v3.py
          python3 visual_upgrade_v3.py
          python3 -m py_compile refine_enemy_ai.py
          python3 refine_enemy_ai.py
          python3 -m py_compile visual_combat_polish.py
          python3 visual_combat_polish.py
          python3 -m py_compile pixel_art_lighting_v16.py
          python3 pixel_art_lighting_v16.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import numpy as np
          root=Path("assets/characters")
          frames=[root/f"player_run_{i}.png" for i in range(10)]
          digests={hashlib.sha256(p.read_bytes()).hexdigest() for p in frames}
          assert len(digests)>=8, f"Run animation has only {len(digests)} distinct frames"
          assert all(Image.open(p).size==(80,96) for p in frames), "Unexpected hero frame dimensions"
          assert all((Path("assets/backgrounds")/f"foreground_{i}.png").is_file() for i in range(6))
          assert all(Image.open(Path("assets/backgrounds")/f"act_{i}.png").size==(4200,360) for i in range(6)), "Chapter panorama dimensions changed"
          player_source=Path("scripts/player/player.gd").read_text(encoding="utf-8")
          assert "visual.scale = Vector2(0.72, 0.72)" in player_source, "Hero scale regression: expected slightly smaller 0.72 scale"
          assert "visual.position.y = -36.0" in player_source, "Hero vertical anchor regression"
          ambient=Path("scripts/fx/background_motion.gd").read_text(encoding="utf-8")
          assert "range(210)" in ambient and "range(58)" in ambient and "range(84)" in ambient and "range(24)" in ambient, "Ambient animation density regression"
          cinematic=Path("scripts/fx/cinematic_fx.gd").read_text(encoding="utf-8")
          assert cinematic.count("range(") >= 2 and "queue_redraw" in cinematic, "Cinematic particle animation regression"
          assert "for drop_index in range(10):" in Path("scripts/levels/level.gd").read_text(encoding="utf-8"), "Environmental debris density regression"
          enemy_source=Path("scripts/enemies/enemy.gd").read_text(encoding="utf-8")
          assert "func _begin_attack(" in enemy_source and "_attack_windup > 0.0" in enemy_source, "Enemy telegraph regression"
          assert '_begin_attack("shoot", target_position, 0.46)' in enemy_source, "Shooter warning window regression"
          luminance=[]
          for chapter in range(6):
              image=np.asarray(Image.open(Path("assets/backgrounds")/f"act_{chapter}.png").convert("RGB"),dtype=np.float32)
              luminance.append(float((0.2126*image[:,:,0]+0.7152*image[:,:,1]+0.0722*image[:,:,2]).mean()))
          print(f"ART QUALITY CHECK: {len(digests)} unique run frames; six foreground layers; hero scale 0.72; background mean luminance {[round(x,1) for x in luminance]}.")
          PY

      - name: Install v1.4 chapter-specific cinematic pixel art
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          atlas_parts=(art/cinematics/encoded/cutscene_atlas.*.b64)
          if [ "${#atlas_parts[@]}" -eq 6 ]; then
            cat "${atlas_parts[@]}" | base64 --decode > art/cinematics/cutscene_atlas.webp
            test -s art/cinematics/cutscene_atlas.webp
            mkdir -p assets/cinematics
            cp art/cinematics/cutscene_atlas.webp assets/cinematics/
            python3 -m py_compile visual_upgrade_v4.py
            python3 visual_upgrade_v4.py
          else
            echo "::warning::v1.4 cinematic atlas not integrated: expected six encoded source chunks; found ${#atlas_parts[@]}. Existing chapter backgrounds remain active."
          fi
          # Apply v1.8 last so its cutscene hooks remain compatible with either backdrop path.
          python3 -m py_compile cinematic_pixel_fx.py
          python3 cinematic_pixel_fx.py
          python3 -m py_compile environmental_weather_v19.py
          python3 environmental_weather_v19.py
          python3 -m py_compile hero_sprite_overhaul_v20.py
          python3 hero_sprite_overhaul_v20.py

          # v2.2 final authored pixel-art pass; run after legacy generators so they cannot overwrite it.
          python3 -m py_compile pixel_art_visual_overhaul_v22.py
          python3 pixel_art_visual_overhaul_v22.py


      - name: Package restored project for visual overhaul
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -qr "$RUNNER_TEMP/PosledniySignal-source.zip" . \
            -x ".git/*" ".godot/*" "build/*" ".source/*"

      - name: Upload restored source inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosledniySignal-source-inspection
          path: ${{ runner.temp }}/PosledniySignal-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Validate project files
        run: python3 tools/validate_project.py
      - name: Import, parse and export ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --editor --quit
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android APK (ARM64)" build/PosledniySignal-debug.apk
          test -s build/PosledniySignal-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose build/PosledniySignal-debug.apk
          file build/PosledniySignal-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosledniySignal-Android-ARM64-debug
          path: build/PosledniySignal-debug.apk
          if-no-files-found: error
          retention-days: 30
